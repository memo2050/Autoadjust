name: verify-build
# Runs the reproducible-build verification. No secrets, no deploy, no database. Manual or on pull requests that touch dependencies.
on:
  workflow_dispatch:
  pull_request:
    paths: [package.json, package-lock.json, scripts/**, .github/workflows/verify-build.yml]
permissions: { contents: write }   # only used by the 'commit lockfile' step below, on branches of this same repository
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.head_ref || github.ref }}" }   # the branch itself (not the merge commit), so the lockfile commit lands on the branch
      - uses: actions/setup-node@v4
        with: { node-version: "20.19.0" }
      - name: Run the complete verification (all logs kept, nothing suppressed)
        run: bash scripts/run-verification.sh
      - name: Upload complete logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: verification-logs, path: verification-logs/, retention-days: 30 }
      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: package-lock, path: package-lock.json, if-no-files-found: ignore }
      - name: Commit the verified lockfile to the branch (same-repo branches only; only after the verification PASSED)
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'claude/')
        run: |
          if git status --porcelain package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json; git commit -m "Add package-lock.json generated and verified by CI (verify-build passed)"
            git push origin "HEAD:${{ github.head_ref }}"
          else echo "lockfile already committed and unchanged"; fi
