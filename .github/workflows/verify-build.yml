name: verify-build
# Runs the reproducible-build verification. No secrets, no deploy, no database. Manual or on pull requests that touch dependencies.
on:
  workflow_dispatch:
  pull_request:
    paths: [package.json, package-lock.json, scripts/**, .github/workflows/verify-build.yml]
permissions: { contents: read }   # read-only: this workflow never writes to the repository
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.head_ref || github.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "20.19.0" }
      - name: Run the complete verification (all logs kept, nothing suppressed)
        run: bash scripts/run-verification.sh
      - name: Upload complete logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: verification-logs, path: verification-logs/, retention-days: 30 }
      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: package-lock, path: package-lock.json, if-no-files-found: ignore }
      - name: Check the committed lockfile is exactly what a clean install produces
        if: success()
        run: |
          if git status --porcelain package-lock.json | grep -q .; then
            echo "::error::package-lock.json differs from the verified one. Download the 'package-lock' artifact of this run, review it and commit it yourself."; git --no-pager diff --stat package-lock.json; exit 1
          else echo "lockfile committed and unchanged"; fi
