<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Adjust — Find your plan</title>
<style>
:root{--bg:#0b1020;--card:#121a30;--bd:#25314f;--fg:#e8ecf6;--mut:#93a0bd;--acc:#4f8cff;--bad:#ff6b6b;--ok:#3ecf8e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}h1{font-size:22px;margin:0 0 4px}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}

.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row input{flex:1;min-width:150px}.rec b{color:var(--ok)}[dir=rtl] .u{align-self:flex-start}[dir=rtl] .a{align-self:flex-end}
.hp{position:absolute;left:-9999px}.err{color:var(--bad)}.good{color:var(--ok)}
</style></head><body><main id="root">
<div class="row" style="justify-content:space-between"><div><h1 id="t">Find the right plan</h1><div class="mut" id="sub">Tell us about your environment and get a plan suggestion. Pricing is a launch proposal; online payment is not enabled.</div></div><button class="sec" id="lang">العربية</button></div>

<details class="card"><summary id="fsum">Prefer a form? Request a demo or a call</summary>

<div class="row"><input name="company" placeholder="Company"><input name="job_title" placeholder="Your role"></div>
<div class="row"><input name="endpoints" type="number" min="0" placeholder="Endpoints"><input name="devices" type="number" min="0" placeholder="Network devices"><input name="users" type="number" min="0" placeholder="Users"></div>
<div class="row"><label><input type="checkbox" name="needs" value="soc"> SOC</label><label><input type="checkbox" name="needs" value="noc"> NOC</label><label><input type="checkbox" name="needs" value="wazuh"> Wazuh</label><label><input type="checkbox" name="needs" value="zabbix"> Zabbix</label>
<select name="timeline"><option value="unknown">Timeline</option><option value="now">Now</option><option value="1-3m">1-3 months</option><option value="3-6m">3-6 months</option><option value="later">Later</option></select></div>
<div class="row"><label class="mut">Preferred demo time (optional) <input name="slot" type="datetime-local"></label></div>
<div class="row"><textarea name="message" maxlength="2000" placeholder="Anything else?" style="flex:1;min-height:60px"></textarea></div>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<label class="row"><input type="checkbox" name="consent" required style="flex:none"> <span id="cons">I agree that the AutoAdjust team may contact me by email about this request.</span></label>
<button type="submit" id="go">Send request</button><div id="fmsg" class="mut" role="status"></div></form></details>
<script>
(function(){var $=function(i){return document.getElementById(i)},L="en",A={},busy=false;

apply();add("a",T[L].hi)})();
</script></main></body></html>
